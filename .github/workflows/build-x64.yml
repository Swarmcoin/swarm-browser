# SWARM Browser CI. Registered 2026-09-27; see swarm/README.md.
# SWARM: upstream build-x64 kept as-is (name changed, workflow_dispatch kept).
# The staged design in reusable-build.yml is unchanged.
name: swarm-build-x64
on:
  workflow_dispatch:
  push:
    tags:
      - '*'

permissions:
  contents: read

concurrency:
  group: swarm-build-x64-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
