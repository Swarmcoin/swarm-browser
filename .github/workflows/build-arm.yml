# SWARM: upstream build workflow kept as-is (name changed). arm is not a
# SWARM release target yet, so it runs on manual dispatch only.
name: swarm-build-arm
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-build-arm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      arm: true
