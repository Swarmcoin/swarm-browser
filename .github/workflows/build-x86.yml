# SWARM Browser CI. Registered 2026-09-27; see swarm/README.md.
# SWARM: upstream build workflow kept as-is (name changed). x86 is not a
# SWARM release target yet, so it runs on manual dispatch only.
name: swarm-build-x86
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swarm-build-x86-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      x86: true
